name: "Bug report"
description: "Something in ProsperoEden does not work as it should"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post**

        - Naming a game is fine; compatibility reports need it.
        - Do not post or ask for links to games, keys, firmware or shader caches. Your own save data, attached to
          your report so the problem can be reached, is welcome; do not ask others for theirs.
        - Do not report on games that are not on sale yet, or on copies you did not dump yourself.
        - Issues that break these rules are closed and may be deleted without a reply.
        - Do not post Sony SDK files, firmware, decrypted system files, keys or links to them.
  - type: input
    id: version
    attributes:
      label: "App version"
      description: "The release you installed, for example 01.000.050"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "PS5 system software version"
      description: "For example 12.70"
      placeholder: "12.70"
    validations:
      required: true
  - type: dropdown
    id: enabler
    attributes:
      label: "Homebrew enabler"
      options:
        - "etaHEN"
        - "kstuff-lite"
        - "onionHEN"
        - "Other (name it below)"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: enabler_version
    attributes:
      label: "Homebrew enabler version"
      description: "For example etaHEN 2.5b. Name it here if you chose Other."
    validations:
      required: true
  - type: input
    id: shadowmount
    attributes:
      label: "ShadowMountPlus version"
      description: "Leave empty if you do not use it"
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: "How did you install it?"
      options:
        - "ProsperoStore"
        - "Manual copy (USB or FTP)"
        - "Built from source"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What you saw, and what you expected instead"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: "1. Open ... 2. Select ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Log, screenshot or video"
      description: "Paste the app's log if it has one. Remove anything private first."
      render: text
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: "Save data and debug logs"
      description: |
        Drag two ZIP files here; they let us go to the spot and see what the app did.
        - **Save data** of the game, from just before the problem: Triangle on the game in the Library, **Save data**, **Export a copy**, then zip the folder it writes in `/data/prosperoeden/save-export`.
        - **Debug logs**: turn on **Settings > Diagnostics > Detailed logging**, make the problem happen again, then zip `/data/prosperoeden/logs` (after a crash, the crash report and the logs beside it).
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: "Checks"
      options:
        - label: "I searched the open and closed issues for this problem."
          required: true
        - label: "I am on the latest release."
          required: true
