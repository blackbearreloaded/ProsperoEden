name: Release build

# Builds the release ZIP (make release, which fetches pinned dependencies; docs/BUILDING.md)
# on the self-hosted runner. A manual run keeps the ZIP as a 7-day artifact; a v* tag also
# publishes it as a pre-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, prosperoeden]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: bash tools/ci/build-release.sh

      - name: Match the tag to the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "dist/ProsperoEden-${GITHUB_REF_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ProsperoEden
          path: dist/
          retention-days: 7

      - name: Publish the pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease
          --title "ProsperoEden $GITHUB_REF_NAME" --notes-file dist/release-notes.md
          "dist/ProsperoEden-$GITHUB_REF_NAME.zip" dist/SHA256SUMS
